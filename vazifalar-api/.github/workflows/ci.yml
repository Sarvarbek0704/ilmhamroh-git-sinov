# .github/workflows/ci.yml — 31-qism #34 (BT-17): minimal CI — lokal `npm run check` bilan AYNAN bir xil qadamlar, haqiqiy Postgres (pgvector) va Redis xizmatlari bilan.
# FAQAT FAYL: kanonda ishga tushirilmagan (GitHub Actions — pullik daqiqalar; kurs qarori: tekshiruv lokal `npm run check`, CI qo'lda). Push'da emas — qo'lda (workflow_dispatch)
# va PR'da (o'quvchi xohlasa `pull_request` ni yoqadi). Sirlar yo'q: testlar tashqi API'ga bormaydi (soxta LLM provayder), kalitlar kerak emas.
name: check
on:
  workflow_dispatch:
  # pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/vazifalar_test
      TEST_PRISMA_DATABASE_URL: postgres://postgres@127.0.0.1:5432/vazifalar_test_prisma
      TEST_AUTH_DATABASE_URL: postgres://postgres@127.0.0.1:5432/vazifalar_test_auth
      TEST_NAMUNA_DATABASE_URL: postgres://postgres@127.0.0.1:5432/vazifalar
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # test bazalari: Prisma migratsiyalari (sql/ bilan bir xil sxema — migratsiya-tekshir.sh tekshiradi); namuna bazasi — seed bilan
      - name: Test bazalari
        run: |
          for b in vazifalar_test vazifalar_test_prisma vazifalar_test_auth vazifalar; do
            psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE $b"
            DATABASE_URL=postgres://postgres@127.0.0.1:5432/$b npx prisma migrate deploy
          done
          DATABASE_URL=postgres://postgres@127.0.0.1:5432/vazifalar npm run db:seed
      # parallellik cheklangan: 31 #34 o'lchovi — DB'ga tayangan testlar yuklangan mashinada flaky bo'ldi (2 vCPU runner)
      - run: npm run tip
      - run: npm run lint
      - run: npx vitest run --maxWorkers=2
      - run: npm run build
      - name: Migratsiyalar ↔ schema.prisma (drift bo'lmasin)
        run: DATABASE_URL=postgres://postgres@127.0.0.1:5432/vazifalar_test npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Bog'liqliklar auditi
        run: npm audit --omit=dev --audit-level=high
